name: Pipeline LimonLab Colima

on:
  schedule:
    # Martes a sábado a las 00:17 UTC = lunes a viernes 18:17 hora de Colima
    # (el SNIIM publica en días hábiles)
    - cron: "17 0 * * 2-6"
  workflow_dispatch:        # botón "Run workflow" para ejecutarlo a mano

permissions:
  contents: write           # para guardar los datos nuevos en el repositorio

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Pruebas automáticas (pytest)
        run: python -m pytest

      - name: Ejecutar pipeline (Bronce → Plata → Oro, modo incremental)
        id: pipeline
        env:
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}
        run: python -m src.pipeline

      - name: Guardar datos y bitácoras en el repositorio
        if: success() || steps.pipeline.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data logs docs/E1/reporte_limpieza.md
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "Datos: ejecución automática $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi